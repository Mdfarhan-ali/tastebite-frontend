<div
  class="group overflow-hidden rounded-2xl bg-white shadow-md transition-all duration-300 hover:-translate-y-2 hover:shadow-xl">

  <!-- Image -->

  <div class="overflow-hidden">

    <img
      [src]="food().image"
      [alt]="food().name"
      class="h-64 w-full object-cover transition-transform duration-500 group-hover:scale-110">

  </div>

  <!-- Content -->

  <div class="space-y-4 p-6">

    <div class="flex items-center justify-between">

      <h3 class="text-2xl font-semibold text-gray-900">

        {{ food().name }}

      </h3>

      <span class="font-semibold text-yellow-500">

        ⭐ {{ food().rating }}

      </span>

    </div>

    <div class="flex items-center justify-between">

      <span class="text-2xl font-bold text-red-600">

        ₹{{ food().price }}

      </span>

      <app-button variant="primary">

        Order Now

      </app-button>

    </div>

  </div>

</div>
