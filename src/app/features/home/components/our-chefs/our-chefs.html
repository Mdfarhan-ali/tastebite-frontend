<section class="py-24 bg-gray-50">

    <app-container>

        <div class="text-center mb-16">

            <span class="text-red-600 uppercase tracking-[0.3em] text-sm font-semibold">
                Our Team
            </span>

            <h2 class="text-5xl font-bold mt-4">
                Meet Our Expert Chefs
            </h2>

        </div>

        <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">

            @for (chef of chefs; track chef.id) {

            <div
                class="overflow-hidden rounded-2xl bg-white shadow-md transition-all duration-300 hover:-translate-y-2 hover:shadow-xl">

                <img
                    [src]="chef.image"
                    [alt]="chef.name"
                    class="h-96 w-full object-cover">

                <div class="p-6 text-center">

                    <h3 class="text-2xl font-semibold">

                        {{ chef.name }}

                    </h3>

                    <p class="mt-2 text-red-600">

                        {{ chef.role }}

                    </p>

                </div>

            </div>

            }

        </div>

    </app-container>

</section>
